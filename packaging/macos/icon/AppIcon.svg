<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- mbar app icon. Big Sur grid: 824x824 squircle (superellipse, n=5) centred on a 1024 canvas.
