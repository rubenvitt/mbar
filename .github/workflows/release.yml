name: Release
on:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release commits, tags, GitHub releases
      pull-requests: write  # the release PR
      issues: write         # "autorelease: pending/tagged" labels
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A PR opened with the default GITHUB_TOKEN triggers no workflows, so
          # the required CI checks would never run on the release PR. A PAT
          # (contents, pull requests, issues: read/write) avoids that and the
          # "Allow GitHub Actions to create pull requests" repo setting.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # Only when release-please just created a release (not on ordinary pushes
    # or release-PR updates).
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-15
    permissions:
      contents: write  # gh release upload
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; PW=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          # Word splitting is intended: one argument per existing keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Write notary and Sparkle keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
      - name: Build, sign, notarize
        env:
          MBAR_SIGN_IDENTITY: "Developer ID Application: Ruben Vitt (H95J852PKP)"
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: make dmg && make verify-app
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${TAG#v}
          gh release upload "$TAG" "dist/mbar-$V.dmg" "dist/mbar-$V.zip" dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
