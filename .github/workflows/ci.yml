name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (core tests, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: macOS (build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: mbar-macos-${{ runner.arch }}
          path: target/release/mbar
          if-no-files-found: error
          retention-days: 14

  macos-ui:
    name: macOS (mbar-ui)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/mbar-ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # mbar-ui is its own workspace with its own target directory.
          workspaces: crates/mbar-ui -> target
      - run: cargo build --release
      - run: cargo test --no-default-features
